name: Datoko checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: datoko
          POSTGRES_PASSWORD: datoko_test
          POSTGRES_DB: datoko_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U datoko -d datoko_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://datoko:datoko_test@localhost:5432/datoko_test
      TEST_DATABASE_URL: postgresql://datoko:datoko_test@localhost:5432/datoko_test
      DATOKO_MODE: demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npx prisma validate
      - run: npm test
      - run: npm run typecheck
      - run: npm run db:deploy
      - run: npm run test:db
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:auth
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
